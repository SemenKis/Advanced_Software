<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supply Chain and Logistics System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px 0;
        }


        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .feature-button {
            display: inline-block;
            padding: 12px 20px;
            background: #e5566f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .feature-button:hover {
            background: #2a0a10;
        }
    </style>
</head>

<body>

    <header>
        <h1>Supply Chain and Logistics System</h1>
    </header>

    <main>

        <div class="features">

            <h2>Inventory Management</h2>

            <a
                class="feature-button"
                href="http://localhost:8081"
            >
                Open Inventory
            </a>


            <h2>Order Management</h2>

            <a
                class="feature-button"
                href="http://localhost:8082"
            >
                Open Orders
            </a>


            <h2>Warehouse Management</h2>

            <a
                class="feature-button"
                href="http://localhost:8083"
            >
                Open Warehouse
            </a>


            <h2>Transportation Management</h2>

            <a
                class="feature-button"
                href="http://localhost:3004"
            >
                Open Transportation
            </a>

        </div>
    </main>

</body>
</html>
