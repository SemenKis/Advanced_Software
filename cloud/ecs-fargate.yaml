Outputs:
  ApplicationUrl:
    Description: Public application entry point.
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}/"
  InventoryUrl:
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}/inventory/"
  OrdersUrl:
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}/orders/"
  WarehouseUrl:
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}/warehouse/"
  TransportationUrl:
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}/transportation/"
  EfsFileSystemId:
    Description: Persistent SQLite database storage. Retain/back up or delete deliberately when cleaning up.
    Value: !Ref DatabaseFileSystem
