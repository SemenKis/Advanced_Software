server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        return 200 "ok\n";
    }

    location = /transportation/healthz {
        return 200 "ok\n";
    }

    location = /transportation {
        return 301 /transportation/;
    }

    location ^~ /transportation/api/transportation/ {
        proxy_pass ${TRANSPORT_BACKEND_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|html|png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;
        try_files $uri =404;
    }

    location /api/transportation/ {
        proxy_pass ${TRANSPORT_BACKEND_URL}/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /transportation/ {
        rewrite ^/transportation/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }
}
