services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: transportation-backend

    ports:
      - "5004:5004"

    environment:
      DATABASE_PATH: /app/database/transportation.db
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:0.5b

    extra_hosts:
      - "host.docker.internal:host-gateway"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: transportation-frontend

    ports:
      - "3004:80"

    depends_on:
      - backend