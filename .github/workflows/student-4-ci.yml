name: student-4-sam

on:
  workflow_dispatch:
  push:
    paths:
      - 'student-4-sam/**'
      - 'ai-services/multi-agent-server/**'
      - 'ai-services/rag-server/**'
      - 'agentic-review/**'
      - 'scripts/transportation/**'
      - 'scripts/deploy/**'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - '.github/workflows/student-4-ci.yml'
      - '.github/workflows/cloud-deployment.yml'
  pull_request:
    paths:
      - 'student-4-sam/**'
      - 'ai-services/multi-agent-server/**'
      - 'ai-services/rag-server/**'
      - 'agentic-review/**'
      - 'scripts/transportation/**'
      - 'scripts/deploy/**'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - '.github/workflows/student-4-ci.yml'
      - '.github/workflows/cloud-deployment.yml'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanners
        run: python -m pip install ruff==0.17.1 detect-secrets==1.5.0 pip-audit==2.10.1 # pragma: allowlist secret - scanner package names and versions
      - name: Run all three security scanners (CI evidence, separate from local commit evidence)
        run: python scripts/transportation/security_report.py all --context ci --output-dir reports/security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transportation-security-ci
          path: reports/security/
          if-no-files-found: error

  endpoint-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r scripts/transportation/requirements-test.txt
      - name: Test GET and POST shipment functions, integrations, and evidence validation
        run: python scripts/transportation/test_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transportation-test-results
          path: student-4-sam/evidence/
          if-no-files-found: error

  docker-validation:
    runs-on: ubuntu-latest
    needs: [security, endpoint-tests]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate transportation containers
        env:
          MULTI_AGENT_ENABLED: 'false'
        run: |
          mkdir -p reports/docker
          set -o pipefail
          docker compose -f student-4-sam/docker-compose.yml config --quiet
          docker compose -f student-4-sam/docker-compose.yml build 2>&1 | tee reports/docker/build.txt
          docker compose -f student-4-sam/docker-compose.yml up -d
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://localhost:3004/health
          curl --fail http://localhost:3004/api/shipments | tee reports/docker/shipments.json
          curl --fail http://localhost:3004/ > reports/docker/frontend.html
      - name: Save the validated images for cloud deployment
        run: |
          mkdir -p reports/images
          backend_image=$(docker compose -f student-4-sam/docker-compose.yml images -q backend)
          frontend_image=$(docker compose -f student-4-sam/docker-compose.yml images -q frontend)
          docker tag "$backend_image" "transportation-backend:$GITHUB_SHA"
          docker tag "$frontend_image" "transportation-frontend:$GITHUB_SHA"
          docker save -o reports/images/transportation-images.tar "transportation-backend:$GITHUB_SHA" "transportation-frontend:$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: transportation-images
          path: reports/images/transportation-images.tar
          retention-days: 7
      - name: Collect container logs
        if: always()
        run: docker compose -f student-4-sam/docker-compose.yml logs > reports/docker/container-logs.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transportation-docker-validation
          path: reports/docker/
      - name: Stop containers
        if: always()
        run: docker compose -f student-4-sam/docker-compose.yml down

  testing-review:
    runs-on: ubuntu-latest
    needs: [security, endpoint-tests, docker-validation]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: transportation-test-results
          path: student-4-sam/evidence/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: transportation-security-ci
          path: student-4-sam/evidence/ci-security/
      - name: Install review dependency
        run: python -m pip install requests
      - name: Generate evidence-based testing review and validation log
        env:
          DOCKER_VALIDATION_RESULT: ${{ needs.docker-validation.result }}
        run: python agentic-review/review_loop.py --student student-4-sam --category testing --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transportation-testing-review
          path: |
            student-4-sam/evidence/testing-review.md
            student-4-sam/evidence/testing-validation.json
