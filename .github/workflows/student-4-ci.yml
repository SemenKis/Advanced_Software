name: student-4-sam

on:
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose
        run: docker compose version

      - name: Build Transportation services
        working-directory: ./student-4-sam
        run: docker compose build

  smoke-check:
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose
        run: docker compose version

      - name: Start Transportation services
        working-directory: ./student-4-sam
        run: docker compose up -d

      - name: Smoke checks
        run: |
          check_url() {
            local url="$1"
            local attempts=8
            local code=""

            for i in $(seq 1 "$attempts"); do
              code=$(curl -sS \
                -o /dev/null \
                -w "%{http_code}" \
                --connect-timeout 5 \
                --max-time 20 \
                "$url" || true)

              if [ "$code" = "200" ]; then
                echo "PASS $url -> $code"
                return 0
              fi

              echo "Retry $i/$attempts for $url (got: ${code:-none})"
              sleep 2
            done

            echo "FAIL $url after $attempts attempts"
            return 1
          }

          check_url "http://localhost:3004/"
          check_url "http://localhost:5004/health"

      - name: Show container logs on failure
        if: failure()
        working-directory: ./student-4-sam
        run: docker compose logs

      - name: Stop Transportation services
        if: always()
        working-directory: ./student-4-sam
        run: docker compose down -v

  evidence-pack:
    runs-on: ubuntu-latest
    needs: smoke-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Generate report.json
        run: |
          cat > reports/report.json << EOF
          {
            "workflow_name": "student-4-sam",
            "run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "generated_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Generate report.md
        run: |
          cat > reports/report.md << EOF
          ## Transportation Management Workflow Report

          - Workflow: student-4-sam
          - Run ID: ${{ github.run_id }}
          - Commit SHA: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Generate run-view.md
        run: |
          cat > reports/run-view.md << EOF
          ## GitHub Actions Run

          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-4-sam-report
          path: reports