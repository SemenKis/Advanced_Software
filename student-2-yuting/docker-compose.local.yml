services:
  database:
    build: ./database
    container_name: student2-database
    environment:
      - DB_PATH=/data/warehouse.db
    volumes:
      - student2-db-data:/data

  backend:
    build: ./backend
    container_name: student2-backend
    environment:
      - DB_SERVICE_URL=http://database:5002
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: student2-frontend
    environment:
      - BACKEND_URL=http://backend:5001
    ports:
      - "5000:5000"
    depends_on:
      - backend

volumes:
  student2-db-data:
