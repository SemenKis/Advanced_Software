<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Warehouse Management - Student 2 Yuting</title>
    <script src="/static/htmx.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 2rem; color: #032c24; background-color: #d3eaf8; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; background-color: #ffffff; }
        th, td { border: 1px solid #376f7e; padding: 10px 14px; text-align: left; font-size: 0.9rem; }
        th { background-color: #a5d5e9; color: #032c24; }
        nav { background-color: #032c24; padding: 12px 20px; border-radius: 8px; }
        nav a { margin-right: 1.2rem; text-decoration: none; font-weight: bold; color: #d3eaf8; }
        nav a:hover { color: #a5d5e9; }

        .ai-button {
            background-color: #032c24;
            color: #d3eaf8;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        .ai-button:hover {
            background-color: #376f7e;
        }

        form:not(.inline) input,
        form:not(.inline) select {
            padding: 8px 10px;
            margin-right: 16px;
            margin-bottom: 10px;
        }
        form:not(.inline) button {
            padding: 8px 18px;
        }

        td form.inline { 
            display: inline-block; 
            margin-right: 16px;
        }

        td form.inline:last-child {
            margin-right: 0;
        }

        td form.inline input,
        td form.inline select {
            margin-right: 8px;
            padding: 5px 7px;
        }
        td form.inline button {
            padding: 5px 14px; 
        }

    </style>
</head>
<body>
    <nav>
        <a href="http://localhost:8080">Team Home</a>
        <a href="/storage">Storage</a>
        <a href="/packing-lists">Packing Lists</a>
        <a href="/shipping-tasks">Shipping Tasks</a>
        <a href="/mcp-rag">MCP &amp; RAG</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
