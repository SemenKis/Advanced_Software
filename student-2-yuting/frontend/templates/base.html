<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Warehouse Management - Student 2 Yuting</title>
    <script src="/static/htmx.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 2rem; color: #1F3D2B; background-color: #F1F0E2; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; background-color: #ffffff; }
        th, td { border: 1px solid #D5D3BC; padding: 10px 14px; text-align: left; font-size: 0.9rem; }
        th { background-color: #6B8F5E; color: #FFFFFF; }
        tr:nth-child(even) td { background-color: #F8F7EE; }
        nav { background-color: #1F3D2B; padding: 12px 20px; border-radius: 8px; }
        nav a { margin-right: 0.4rem; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; color: #E6EBD8; }
        nav a:hover { background-color: #A65D57; color: #FFFFFF; }

        button {
            background-color: #4E7A47;
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background-color: #3A6035; }
        td form.inline:not([hx-delete]) button {
            background-color: transparent;
            color: #4E7A47;
            border: 2px solid #4E7A47;
        }
        td form.inline:not([hx-delete]) button:hover {
            background-color: #4E7A47;
            color: #FFFFFF;
        }
        td form.inline[hx-delete] button { background-color: #A65D57; }
        td form.inline[hx-delete] button:hover { background-color: #8C4A45; }
        input, select {
            border: 1px solid #B9B7A0;
            border-radius: 6px;
            background-color: #FFFFFF;
        }

        .ai-button {
            background-color: #4E7A47;
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        .ai-button:hover {
            background-color: #3A6035;
        }

        form:not(.inline) input,
        form:not(.inline) select {
            padding: 8px 10px;
            margin-right: 16px;
            margin-bottom: 10px;
        }
        form:not(.inline) button {
            padding: 8px 18px;
        }

        td form.inline { 
            display: inline-block; 
            margin-right: 16px;
        }

        td form.inline:last-child {
            margin-right: 0;
        }

        td form.inline input,
        td form.inline select {
            margin-right: 8px;
            padding: 5px 7px;
        }
        td form.inline button {
            padding: 5px 14px; 
        }

    </style>
</head>
<body>
    <nav>
        <a href="http://localhost:8080">Team Home</a>
        <a href="/storage">Storage</a>
        <a href="/packing-lists">Packing Lists</a>
        <a href="/shipping-tasks">Shipping Tasks</a>
        <a href="/mcp-rag">MCP &amp; RAG</a>
        <a href="/multi-agent">Multi-Agent</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
