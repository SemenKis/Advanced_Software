services:
    order-frontend:
        build: ./frontend
        ports: ["8082:80"]
        depends_on: [order-backend]
        networks: [order-network]

    order-backend:
        build: ./backend
        environment:
            DATABASE_SERVICE_URL: http://order-database:5002
            OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
            OLLAMA_MODEL: qwen2.5:0.5b
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on: [order-database]
        networks: [order-network]

    order-database:
        build: ./database
        volumes: [order-database-data:/app/data]
        networks: [order-network]

volumes:
    order-database-data:
networks:
    order-network:
        driver: bridge
