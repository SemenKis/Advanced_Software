<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <form id="create-order-form">
    <input type="text" id="order-name" placeholder="Order name" required />
    <button type="submit">Create Order</button>
  </form>

   
  <button id="show-orders-btn">Show All Orders</button>
 
  <div id="orders-result"></div>
 


  <script>
    document.getElementById("create-order-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const order_name = document.getElementById("order-name").value;
 
      const res = await fetch("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ order_name }),
      });
 
      const result = await res.json();
      document.getElementById("order-name").value = "";
      // refresh the list after a successful create
      loadOrders();
    });
 
    document.getElementById("show-orders-btn").addEventListener("click", loadOrders);
 
    async function loadOrders() {
      const resultEl = document.getElementById("orders-result");
      resultEl.textContent = "Loading...";
 
      try {
        const res = await fetch("/api/orders");
        if (!res.ok) {
          throw new Error(`Request failed: ${res.status}`);
        }
        const orders = await res.json();
 
        if (!orders.length) {
          resultEl.textContent = "No orders found.";
          return;
        }
 
        const list = document.createElement("ul");
        orders.forEach((order) => {
          const item = document.createElement("li");
          item.textContent = `#${order.order_id} - ${order.order_name}`;
          list.appendChild(item);
        });
 
        resultEl.replaceChildren(list);
      } catch (err) {
        resultEl.textContent = "Failed to load orders.";
      }
    }
  </script>

</body>
</html>
