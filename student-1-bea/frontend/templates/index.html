<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <form id="create-order-form">
    <input type="text" id="order-name" placeholder="Order name" required />
    <input type="text" id="order-address" placeholder="Order address" required />
    <input type="text" id="product-name" placeholder="Product name" required />
    <input type="number" id="quantity" placeholder="Quantity" required />
    <input type="number" id="total-amount" placeholder="Amount" min="0" step="0.01" required />
    <button type="submit">Create Order</button>
  </form>
   
  <button id="show-orders-btn">Show All Orders</button>
 
  <div id="orders-result"></div>
 


  <script>
    document.getElementById("create-order-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const order_name = document.getElementById("order-name").value;
      const order_address = document.getElementById("order-address").value;
      const product_name = document.getElementById("product-name").value;
      const quantity = document.getElementById("quantity").value;
      const total_amount = document.getElementById("total-amount").value;
 
      const res = await fetch("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            order_name,
            order_address,
            product_name,
            quantity,
            total_amount,
          }),
      });
 
      const result = await res.json();
      // refresh the list after a successful create
      e.target.reset();
      document.getElementById("quantity").value = 1;
      loadOrders();
    });
 
    document.getElementById("show-orders-btn").addEventListener("click", loadOrders);
 
    async function loadOrders() {
      const resultEl = document.getElementById("orders-result");
      resultEl.textContent = "Loading...";
 
      try {
        const res = await fetch("/api/orders");
        if (!res.ok) {
          throw new Error(`Request failed: ${res.status}`);
        }
        const orders = await res.json();
 
        if (!orders.length) {
          resultEl.textContent = "No orders found.";
          return;
        }
 
        const list = document.createElement("ul");
        orders.forEach((order) => {
          const item = document.createElement("li");
          item.textContent =
            `${order.order_ref} - ${order.order_name} - ${order.order_address} - ` +
            `[${order.order_status}] - ${order.product_name} x${order.quantity} - $${order.total_amount}`;
        });
        list.appendChild(item);
        
        resultEl.replaceChildren(list);
      } catch (err) {
        resultEl.textContent = "Failed to load orders.";
      }
    }
  </script>

</body>
</html>
