server {
    listen 80;

    location = /healthz {
        return 200 "ok\n";
    }

    location = /orders/healthz {
        return 200 "ok\n";
    }

    location = /orders {
        return 301 /orders/;
    }

    location ^~ /orders/api/ {
        rewrite ^/orders/api/(.*)$ /$1 break;
        proxy_pass ${ORDER_BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /orders/ {
        rewrite ^/orders/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass ${ORDER_BACKEND_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}