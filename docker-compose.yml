name: warehouse-app

services:
  shared-frontend:
    build:
      context: ./shared
      dockerfile: Dockerfile
    container_name: shared-frontend
    ports:
      - "8080:80"
    environment:
      INVENTORY_URL: ${INVENTORY_URL:-http://localhost:8081}
      ORDERS_URL: ${ORDERS_URL:-http://localhost:8082}
      WAREHOUSE_URL: ${WAREHOUSE_URL:-http://localhost:5000}
      TRANSPORTATION_URL: ${TRANSPORTATION_URL:-http://localhost:3004}
    networks:
      - team-network
    restart: unless-stopped

include: 
  - student-1-bea/docker-compose.yml
  - student-2-yuting/docker-compose.yml
  - student-3-lois/docker-compose.yml
  - student-4-sam/docker-compose.yml

networks:
  team-network:
    external: true