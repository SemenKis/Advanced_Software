services:
    order-frontend:
        build: ./student-1-bea/frontend
        ports: ["8080:80"]
        depends_on: [order-backend]
        networks: [order-network]

    order-backend:
        build: ./student-1-bea/backend
            # context: . - only need context if need access outside container
            # dockerfile: order-service/Dockerfile
        environment:
            DATABASE_SERVICE_URL: http://order-database:5002
        depends_on: [order-database]
        networks: [order-network]
        # no published port - only frontend-service reaches it

    order-database:
        build: ./student-1-bea/database
        volumes: [database_data:/app/data]
        networks: [order-network]

volumes:
    database_data:
networks:
    order-network:
        driver: bridge